<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUBS! — Receipt capture</title>
<style>
:root{--bg:#12181f;--panel:#1d2730;--panel2:#27343f;--text:#f6f7f8;--muted:#aebbc5;--line:#3b4a55;--accent:#e6a65d;--accentInk:#2c1907;--blue:#a9d7e9;--warn:#e8c172;--danger:#f2a0a0;--radius:20px;--shadow:0 10px 26px #08101566}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-size:16px}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:640px;margin:auto;min-height:100vh;padding:18px 16px 170px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.brand{font-size:34px;letter-spacing:-1.5px;font-weight:900;margin:0}.eyebrow,.muted{color:var(--muted)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin:3px 0 7px}.week{font-weight:700;margin:0}.pill{padding:8px 11px;background:var(--panel2);border-radius:999px;color:var(--blue);font-size:13px;font-weight:800;white-space:nowrap}.notice{background:#14232c;border:1px solid var(--line);border-radius:13px;padding:11px 13px;color:var(--muted);font-size:13px;line-height:1.35;margin:18px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 20px}.btn{border-radius:13px;padding:15px 14px;font-weight:850;min-height:51px;text-align:center}.primary{background:var(--accent);color:var(--accentInk)}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.full{width:100%}.sectionTitle{font-size:18px;margin:23px 0 10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.receipt{width:100%;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;padding:15px;background:transparent;color:var(--text);text-align:left;border-bottom:1px solid var(--line)}.receipt:first-child{border-radius:var(--radius) var(--radius) 0 0}.receipt:last-child{border-bottom:0;border-radius:0 0 var(--radius) var(--radius)}.receipt:only-child{border-radius:var(--radius)}.datebox{font-size:14px;font-weight:900;line-height:1.1;color:var(--blue)}.datebox span{display:block;font-size:22px;color:var(--text)}.job{font-weight:850;font-size:17px}.merchant{font-size:14px;color:var(--muted);margin-top:3px}.status{font-size:11px;color:var(--accent);font-weight:800;text-align:right}.chev{color:var(--muted);font-size:21px}.nav{position:fixed;bottom:0;left:0;right:0;background:#12212bfa;border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:9px max(8px,calc((100% - 640px)/2)) calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);z-index:2}.nav button{background:transparent;color:var(--muted);padding:9px 11px;min-height:50px;font-size:12px;font-weight:800}.nav button.active{color:var(--accent)}.actionBar{position:fixed;left:0;right:0;bottom:68px;z-index:2;padding:10px max(16px,calc((100% - 608px)/2));display:grid;grid-template-columns:.85fr 1.35fr;gap:10px;background:linear-gradient(transparent,#101b25 26%)}.actionBar button{border-radius:16px;min-height:62px;padding:0 13px;font-weight:900;font-size:15px;box-shadow:0 8px 24px #06151199}.actionBar .sendFixed{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.actionBar .captureFab{background:var(--accent);color:var(--accentInk);font-size:17px}.camera{font-size:20px;vertical-align:-2px;margin-right:6px}.emptyAction{margin-top:12px}.view{display:none}.view.active{display:block}.formCard{padding:17px}.formCard label{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}.formCard input,.formCard select{width:100%;background:#101d26;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:13px;min-height:48px}.formCard input:focus,.formCard select:focus{outline:2px solid var(--accent);outline-offset:1px}.error{color:var(--danger);font-size:14px;font-weight:700;min-height:20px;margin-top:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.imagePick{display:block;position:relative;border:1px dashed #62808f;border-radius:13px;padding:18px 15px;text-align:center;color:var(--blue);font-weight:800;background:#13232d;min-height:66px}.imagePick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.captureChoices{display:grid;gap:12px;margin-top:18px}.captureChoice{display:block;position:relative;padding:22px 18px;border-radius:16px;background:var(--accent);color:var(--accentInk);font-weight:900;font-size:18px;text-align:center;min-height:76px}.captureChoice.secondaryChoice{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.captureChoice input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.demoLabel{font-size:12px;color:var(--muted);line-height:1.4;margin:9px 0 0}.detailImg,.placeholder{width:100%;height:260px;object-fit:contain;border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(135deg,#294454,#162631)}.zoomImage{width:100%;height:calc(100vh - 110px);object-fit:contain;background:#071017;border-radius:var(--radius)}.placeholder{display:grid;place-items:center;text-align:center;color:#d4e7ed;font-weight:800;font-size:20px;line-height:1.4}.detailCard{padding:18px;margin-top:14px}.detailCard h2{margin:0 0 13px}.meta{display:grid;grid-template-columns:105px 1fr;gap:10px;margin:10px 0}.meta b{color:var(--muted);font-size:13px}.filename{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere;color:var(--blue)}.back{background:none;color:var(--blue);padding:7px 0;font-weight:850;margin-bottom:10px}.modalWrap{position:fixed;inset:0;background:#071017ad;display:none;align-items:end;justify-content:center;padding:16px;z-index:3}.modalWrap.show{display:flex}.modal{max-width:608px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.45}.summary{background:#10202a;padding:13px;border-radius:12px;margin:15px 0;font-size:14px;line-height:1.6}.summary strong{color:var(--text)}.historyItem,.weekItem{padding:15px;border-bottom:1px solid var(--line)}.historyItem:last-child,.weekItem:last-child{border:0}.historyType{font-weight:850;color:var(--blue)}.historyText{font-size:13px;color:var(--muted);line-height:1.45;margin-top:4px}.weekItem{display:flex;justify-content:space-between;gap:10px;align-items:center}.weekItem b{display:block}.linkBtn{color:var(--accent);background:transparent;font-weight:850;padding:8px 0}.setting{padding:15px;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting label{display:block;font-weight:800;margin-bottom:7px}.setting input,.setting select{background:#10202a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;min-height:45px}.toggle{display:flex;justify-content:space-between;align-items:center}.toggle input{width:26px;height:26px;accent-color:var(--accent)}.receiptCard{grid-template-columns:64px 1fr auto;min-height:88px;padding:10px 12px;background:linear-gradient(145deg,#202b35,#19232c);transition:background .15s,transform .15s}.receiptCard+.receiptCard{margin-top:8px;border-top:1px solid var(--line);border-radius:15px}.receiptCard:first-child{border-radius:var(--radius)}.receiptCard:last-child{border-radius:var(--radius);border-bottom:1px solid var(--line)}.receiptCard:hover,.receiptCard:focus-visible{background:#2b3843}.receiptCard:active{transform:scale(.985)}.receiptThumb{width:58px;height:68px;border-radius:10px;object-fit:cover;object-position:center;border:1px solid #53636e;background:#0d141a;box-shadow:0 3px 9px #09101688}.receiptInfo{min-width:0;padding:2px 2px}.receiptCard .job{font-size:18px;letter-spacing:-.2px}.receiptMeta{font-size:13px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.receiptCard .chev{padding-left:5px;color:var(--accent);font-size:24px}.empty{text-align:center;color:var(--muted);padding:38px 24px;border-radius:var(--radius);background:radial-gradient(circle at 50% 0,#35414b66,transparent 60%);line-height:1.6}.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}.sample{font-size:12px;color:var(--warn);font-weight:800;margin:12px 0 4px}.small{font-size:13px;color:var(--muted);line-height:1.45}@media(min-width:650px){.app{padding-top:28px}.receiptCard{grid-template-columns:72px 1fr auto}.receiptThumb{width:64px;height:76px}}
</style>
</head>
<body>
<main class="app">
<section id="home" class="view active"></section>
<section id="capture" class="view"></section>
<section id="add" class="view"></section>
<section id="detail" class="view"></section>
<section id="archive" class="view"></section>
<section id="history" class="view"></section>
<section id="settings" class="view"></section>
</main>
<div id="actionBar" class="actionBar"><button class="sendFixed" data-action="send-current-week">Send week now</button><button class="captureFab" data-action="open-capture" aria-label="Capture receipt"><span class="camera">▣</span>Capture receipt</button></div>
<nav class="nav" aria-label="Primary navigation"><button data-action="go-home">Current Week</button><button data-action="go-archive">Archive</button><button data-action="go-history">Delivery history</button><button data-action="go-settings">Settings</button></nav>
<div id="modalWrap" class="modalWrap" role="dialog" aria-modal="true"><div id="modal" class="modal"></div></div>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state; let selectedImage=null;
const today=new Date(); const iso=d=>new Date(d).toISOString().slice(0,10); const dayISO=d=>{let x=new Date(d);x.setHours(12,0,0,0);return x.toISOString().slice(0,10)};
function monday(d=new Date()){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function rangeFor(d){let a=monday(d),b=new Date(a);b.setDate(a.getDate()+6);return {start:dayISO(a),end:dayISO(b)}}function pretty(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function shortDate(d){let x=new Date(d+'T12:00:00');return {m:x.toLocaleDateString(undefined,{month:'short'}).toUpperCase(),d:x.getDate()}}
function clean(s){return s.trim().replace(/\s+/g,'-').replace(/[^A-Za-z0-9_-]/g,'')||'Receipt'}function filename(r){return `${r.date}_${clean(r.job)}${r.merchant?'_'+clean(r.merchant):''}.jpg`}function packageName(r,add=false){return `Receipts_${r.start}_to_${r.end}${add?'_Additions':''}.zip`}function key(r){return r.start+'_'+r.end}
function seed(){let cur=rangeFor(today),p=new Date(cur.start+'T12:00:00');p.setDate(p.getDate()-7);let prev=rangeFor(p);state={receipts:[{id:1,date:cur.start,job:'Smith',merchant:'Home Depot',created:1,sample:true},{id:2,date:dayISO(new Date(new Date(cur.start+'T12:00:00').getTime()+2*864e5)),job:'Jones',merchant:'',created:2,sample:true},{id:3,date:dayISO(new Date(new Date(cur.start+'T12:00:00').getTime()+4*864e5)),job:'Smith',merchant:'Menards',created:3,sample:true},{id:4,date:prev.start,job:'Smith',merchant:'Home Depot',created:0,sample:true}],history:[{id:1,at:new Date(Date.now()-864e5*3).toISOString(),type:'Weekly package',recipient:'foreman@northside.example',range:prev,ids:[4],name:packageName(prev),sample:true}],settings:{enabled:true,email:'foreman@northside.example',weekday:'Sunday',time:'20:00'},nextId:5,nextCreated:4}}seed();
function receiptsFor(r){return state.receipts.filter(x=>x.date>=r.start&&x.date<=r.end).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created)}function sentForWeek(r){return new Set(state.history.filter(h=>h.range&&h.range.start===r.start&&h.range.end===r.end&&(h.type==='Weekly package'||h.type==='Additions package')).flatMap(h=>h.ids))}
function show(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#'+name).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.action===`go-${name}`));$('#actionBar').hidden=name!=='home';if(name==='home')renderHome();if(name==='capture')renderCapture();if(name==='archive')renderArchive();if(name==='history')renderHistory();if(name==='settings')renderSettings();window.scrollTo(0,0)}
function row(r, weekSet){let d=shortDate(r.date);return `<button class="receipt" data-action="detail" data-id="${r.id}"><div class="datebox">${d.m}<span>${d.d}</span></div><div><div class="job">${esc(r.job)}</div>${r.merchant?`<div class="merchant">${esc(r.merchant)}</div>`:''}</div><div>${weekSet.has(r.id)?'<div class="status">PACKAGED</div>':''}<div class="chev">›</div></div></button>`}
function header(r,count){return `<header class="top"><div><p class="eyebrow">Current Week · Work receipt organizer</p><h1 class="brand">STUBS!</h1><p class="week">${pretty(r.start)} — ${pretty(r.end)}</p></div><div class="pill">${count} receipt${count===1?'':'s'}</div></header>`}
function renderHome(){let r=rangeFor(today),rs=receiptsFor(r),set=sentForWeek(r),content=rs.map(x=>row(x,set)).join('')||'<div class="empty"><b>No receipts this week yet.</b><br><span class="small">Start by taking a clear photo of your first receipt.</span><button class="btn primary full emptyAction" data-action="open-capture"><span class="camera">▣</span>Take receipt photo</button></div>';$('#home').innerHTML=`${header(r,rs.length)}<div class="notice">Preview demo — selected photos, settings, and delivery history stay in memory only and reset on refresh. ZIP creation, real email sending, and background scheduling are production-app capabilities.</div><div class="sectionTitle">Receipts</div><div class="card">${content}</div><div class="sample">SAMPLE / DEMO DATA is marked throughout this preview.</div><div class="notice"><b>Next planned delivery:</b> ${nextPlan()}</div>`}
function renderAdd(){let t=dayISO(today);$('#add').innerHTML=`<button class="back" data-action="go-home">← Current Week</button><h1 class="brand">Add receipt</h1><p class="muted">Photo selected — add the quick details below.</p><form class="card formCard" id="addForm">${selectedImage?`<img class="detailImg" style="height:150px" src="${selectedImage}" alt="Selected receipt preview">`:'<div class="placeholder" style="height:120px;font-size:15px">DEMO RECEIPT<br><small>Photo placeholder</small></div>'}<div class="demoLabel">Selected photos stay in memory only and reset on refresh.</div><div class="split"><div><label for="date">Date</label><input id="date" type="date" value="${t}" required></div><div><label for="job">Job last name *</label><input id="job" autocomplete="off" placeholder="e.g. Smith"></div></div><label for="merchant">Merchant <span class="muted">(optional)</span></label><input id="merchant" autocomplete="off" placeholder="e.g. Home Depot"><div id="formError" class="error"></div><button type="submit" class="btn primary full">Save Receipt</button><button type="button" class="linkBtn" data-action="open-capture">Choose another photo</button><button type="button" class="linkBtn" style="color:var(--muted);margin-left:14px" data-action="go-home">Cancel</button></form>`;$('#addForm').onsubmit=saveReceipt}
function renderCapture(){selectedImage=null;$('#capture').innerHTML=`<button class="back" data-action="go-home">← Current Week</button><h1 class="brand">Capture Receipt</h1><p class="muted">Add a photo first, then enter the quick details.</p><div class="card formCard"><div class="captureChoices"><label class="captureChoice"><span class="camera">▣</span>Take photo<input id="takePhoto" type="file" accept="image/*" capture="environment"></label><label class="captureChoice secondaryChoice">Choose from photos<input id="choosePhoto" type="file" accept="image/*"></label></div><p class="demoLabel">If camera capture is unavailable, Take photo opens your system photo picker instead.</p><div id="captureError" class="error" aria-live="polite">Choose a photo to continue.</div><button class="linkBtn" data-action="use-placeholder">Continue without a photo (demo)</button><button class="linkBtn" style="color:var(--muted);margin-left:14px" data-action="go-home">Cancel</button></div>`;['takePhoto','choosePhoto'].forEach(id=>$('#'+id).onchange=e=>readPhoto(e.target.files[0]))}function readPhoto(file){if(!file){$('#captureError').textContent='No photo selected. Choose a photo to continue.';return}if(!file.type.startsWith('image/')){$('#captureError').textContent='Please choose an image file.';return}let reader=new FileReader();reader.onerror=()=>{$('#captureError').textContent='That photo could not be read. Please choose another image.'};reader.onload=()=>{selectedImage=reader.result;renderPhotoConfirmation()};reader.readAsDataURL(file)}function renderPhotoConfirmation(){$('#capture').innerHTML=`<button class="back" data-action="go-home">← Current Week</button><h1 class="brand">Photo ready</h1><div class="card formCard"><img class="detailImg" style="height:210px" src="${selectedImage}" alt="Selected receipt preview"><p class="demoLabel">Selected photos remain in memory only and reset on refresh.</p><div class="actions"><button class="btn primary" data-action="continue-capture">Continue</button><button class="btn secondary" data-action="open-capture">Choose another</button></div></div>`}function saveReceipt(e){e.preventDefault();let job=$('#job').value.trim();if(!job){$('#formError').textContent='Please add the job last name before saving.';$('#job').focus();return}let rec={id:state.nextId++,date:$('#date').value,job,merchant:$('#merchant').value.trim(),image:selectedImage,created:state.nextCreated++,sample:false};state.receipts.push(rec);selectedImage=null;show('home')}
function placeholder(){return '<div class="placeholder">DEMO RECEIPT<br><small>Photo placeholder</small></div>'}function renderDetail(id){let r=state.receipts.find(x=>x.id===id);if(!r)return show('home');$('#detail').innerHTML=`<button class="back" data-action="back-week">← Back to Week</button><h1 class="brand">Receipt</h1><div style="margin-top:14px">${r.image?`<img class="detailImg" src="${r.image}" alt="Receipt for ${esc(r.job)}">`:placeholder()}</div>${!r.image?'<p class="demoLabel">Demo behavior: this receipt was saved without a supplied photo.</p>':''}<div class="card detailCard"><h2>${esc(r.job)}</h2><div class="meta"><b>Date</b><span>${pretty(r.date)}</span><b>Merchant</b><span>${r.merchant?esc(r.merchant):'<span class="muted">Not entered</span>'}</span><b>Filename</b><span class="filename">${filename(r)}</span></div><button class="btn primary full" data-action="single-send" data-id="${r.id}">Send this receipt</button><p class="demoLabel">Prototype: delivery is recorded here; real ZIP/email automation requires the production app.</p></div>`}
function modal(content){$('#modal').innerHTML=content;$('#modalWrap').classList.add('show')}function closeModal(){$('#modalWrap').classList.remove('show')}
function confirmWeek(r){let all=receiptsFor(r),ids=all.filter(x=>!sentForWeek(r).has(x.id)).map(x=>x.id);modal(`<h2>Send week now?</h2><p>${pretty(r.start)} — ${pretty(r.end)}</p><div class="summary"><strong>To:</strong> ${esc(state.settings.email)}<br><strong>Included:</strong> ${ids.length} receipt${ids.length===1?'':'s'}<br><strong>Package:</strong> ${packageName(r)}</div><p>Prototype: delivery is recorded here; real ZIP/email automation requires the production app.</p><div class="actions"><button class="btn primary" data-action="confirm-week" data-range="${key(r)}">Record delivery</button><button class="btn secondary" data-action="delivery-cancel">Cancel</button></div><button class="back" data-action="delivery-back">← Back to Current Week</button>`) }
function recordWeek(r,scheduled=false){let ids=receiptsFor(r).filter(x=>!sentForWeek(r).has(x.id)).map(x=>x.id), prior=state.history.some(h=>h.range&&key(h.range)===key(r)&&(h.type==='Weekly package'||h.type==='Additions package'));let additions=scheduled&&prior;let type=ids.length?(additions?'Additions package':'Weekly package'):'No-new-receipts check';state.history.push({id:Date.now(),at:new Date().toISOString(),type,recipient:state.settings.email,range:r,ids,name:ids.length?packageName(r,additions):''});closeModal();show('history')}
function renderHistory(){let list=[...state.history].sort((a,b)=>b.at.localeCompare(a.at));$('#history').innerHTML=`<h1 class="brand">Delivery history</h1><p class="muted">Newest first. This is an in-memory demo log.</p><div class="card">${list.map(h=>{let names=h.ids.map(id=>{let r=state.receipts.find(x=>x.id===id);return r?filename(r):'Receipt'});return `<div class="historyItem"><div class="historyType">${h.type}${h.sample?' · SAMPLE':''}</div><div class="historyText">${new Date(h.at).toLocaleString()}<br>To ${esc(h.recipient)}${h.name?`<br><b>${h.name}</b>`:''}<br>${names.length?`${names.length} included: ${esc(names.join(', '))}`:'No new receipts needed a package.'}</div></div>`}).join('')}</div>`}
function renderArchive(){let cur=rangeFor(today),groups={};state.receipts.forEach(x=>{let r=rangeFor(x.date);if(key(r)!==key(cur))(groups[key(r)]??={r,items:[]}).items.push(x)});let arr=Object.values(groups).sort((a,b)=>b.r.start.localeCompare(a.r.start));$('#archive').innerHTML=`<h1 class="brand">Archive</h1><p class="muted">Previous calendar weeks, including sample/demo receipts.</p><div class="card">${arr.length?arr.map(g=>`<div class="weekItem"><div><b>${pretty(g.r.start)} — ${pretty(g.r.end)}</b><span class="small">${g.items.length} receipt${g.items.length===1?'':'s'}</span></div><button class="linkBtn" data-action="open-week" data-range="${key(g.r)}">View / send</button></div>`).join(''):'<div class="empty">No previous weeks yet.</div>'}</div>`}
function openWeek(r){let rs=receiptsFor(r);$('#archive').innerHTML=`<button class="back" data-action="go-archive">← Archive</button>${header(r,rs.length)}<div class="actions"><button class="btn secondary full" data-action="send-week" data-range="${key(r)}">Send this week</button></div><div class="card">${rs.map(x=>row(x,sentForWeek(r))).join('')}</div>`}
function nextPlan(){if(!state.settings.enabled)return 'Automatic delivery is off.';let days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],target=days.indexOf(state.settings.weekday),d=new Date(),delta=(target-d.getDay()+7)%7;if(delta===0&&d.toTimeString().slice(0,5)>=state.settings.time)delta=7;d.setDate(d.getDate()+delta);let [h,m]=state.settings.time.split(':');d.setHours(h,m,0,0);return d.toLocaleString(undefined,{weekday:'long',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function renderSettings(){let s=state.settings;$('#settings').innerHTML=`<h1 class="brand">Settings</h1><p class="muted">Delivery preferences apply for this preview session only.</p><div class="card"><div class="setting toggle"><label for="enabled">Automatic delivery</label><input id="enabled" type="checkbox" ${s.enabled?'checked':''}></div><div class="setting"><label for="email">Recipient email</label><input id="email" type="email" value="${esc(s.email)}"></div><div class="setting"><label for="weekday">Delivery weekday</label><select id="weekday">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(x=>`<option ${x===s.weekday?'selected':''}>${x}</option>`).join('')}</select></div><div class="setting"><label for="time">Delivery time</label><input id="time" type="time" value="${s.time}"></div></div><div class="notice"><b>Next planned delivery:</b> <span id="next">${nextPlan()}</span><br><span class="small">Real background scheduling and email are not available in this prototype.</span></div><button class="btn primary full" data-action="scheduled">Run scheduled delivery now (demo)</button><button class="linkBtn" style="color:var(--danger);margin-top:13px" data-action="reset">Reset demo data</button>`;['enabled','email','weekday','time'].forEach(id=>$('#'+id).oninput=()=>{s.enabled=$('#enabled').checked;s.email=$('#email').value||'recipient@example.com';s.weekday=$('#weekday').value;s.time=$('#time').value;$('#next').textContent=nextPlan()})}
function splitKey(k){let [start,end]=k.split('_');return{start,end}}function dispatch(action,b){if(action==='open-capture'){show('capture');return}if(action==='send-current-week'){confirmWeek(rangeFor(today));return}if(action==='go-home'){show('home');return}if(action==='go-archive'){show('archive');return}if(action==='go-history'){show('history');return}if(action==='go-settings'){show('settings');return}if(action==='continue-capture'){show('add');renderAdd();return}if(action==='use-placeholder'){selectedImage=null;show('add');renderAdd();return}if(action==='back-week'||action==='delivery-cancel'||action==='delivery-back'){closeModal();show('home');return}if(action==='close'){closeModal();return}if(action==='detail'){renderDetail(+b.dataset.id);show('detail');return}if(action==='send-week'){confirmWeek(splitKey(b.dataset.range));return}if(action==='confirm-week'){recordWeek(splitKey(b.dataset.range));return}if(action==='single-send'){let r=state.receipts.find(x=>x.id===+b.dataset.id);state.history.push({id:Date.now(),at:new Date().toISOString(),type:'Single receipt',recipient:state.settings.email,ids:[r.id]});modal(`<h2>Receipt delivery recorded</h2><p>${esc(filename(r))} remains included in its weekly package.</p><button class="btn primary full" data-action="close">Done</button>`);return}if(action==='open-week'){openWeek(splitKey(b.dataset.range));return}if(action==='scheduled'){recordWeek(rangeFor(today),true);return}if(action==='reset'){modal(`<h2>Reset demo data?</h2><p>This clears receipts, delivery history, and preferences from this browser session, then restores the original sample data.</p><div class="actions"><button class="btn primary" data-action="confirm-reset">Reset demo</button><button class="btn secondary" data-action="close">Cancel</button></div>`);return}if(action==='confirm-reset'){seed();closeModal();show('home')}}document.addEventListener('click',e=>{let b=e.target.closest('[data-legacy-action]');if(b)dispatch(b.dataset.legacyAction,b)});show('home');
</script>
<script>
(()=>{
'use strict';
const app=document.querySelector('.app');
const nav=document.querySelector('.nav');
const bar=document.getElementById('actionBar');
bar.remove(); nav.remove(); app.innerHTML='';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,receipts=[],deliveries=[],settings={email:'',weekday:'Sunday',time:'20:00'},selected=null,zipState=null;
const today=()=>new Date().toISOString().slice(0,10);
function week(d=today()){let x=new Date(d+'T12:00:00'),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);let a=x.toISOString().slice(0,10);x.setDate(x.getDate()+6);return{start:a,end:x.toISOString().slice(0,10)}}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function safe(s){return String(s||'').trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'Receipt'}
function fileName(r){return `${r.date}_${safe(r.job)}${r.merchant?'_'+safe(r.merchant):''}.jpg`}
function exportable(r){return r&&r.mime==='image/jpeg'&&r.blob instanceof Blob&&r.blob.size>0&&/^[0-9]{4}-[0-9]{2}-[0-9]{2}_[A-Za-z0-9-]+(?:_[A-Za-z0-9-]+)?\.jpg$/.test(fileName(r))}
function eligibleFor(range,covered){return receipts.filter(r=>r.date>=range.start&&r.date<=range.end&&!covered.has(r.id)&&exportable(r))}
function packName(w,addition){return `Receipts_${w.start}_to_${w.end}${addition?'_Additions':''}.zip`}
function openDB(){return new Promise((ok,bad)=>{let q=indexedDB.open('stubs-field-test',1);q.onupgradeneeded=()=>{let d=q.result;['receipts','deliveries','settings'].forEach(x=>d.objectStoreNames.contains(x)||d.createObjectStore(x,{keyPath:'id'}))};q.onsuccess=()=>ok(q.result);q.onerror=()=>bad(q.error)})}
function all(store){return new Promise((ok,bad)=>{let q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>bad(q.error)})}
function put(store,value){return new Promise((ok,bad)=>{let q=db.transaction(store,'readwrite');q.objectStore(store).put(value);q.oncomplete=()=>ok();q.onerror=()=>bad(q.error)})}
async function load(){try{db=await openDB();receipts=await all('receipts');deliveries=await all('deliveries');let s=await all('settings');if(s[0])settings={...settings,...s[0]};else await put('settings',{id:'local',...settings});show('home')}catch(e){app.innerHTML=`<div class="notice"><b>Local storage is unavailable.</b><br>${esc(e.message)} Reload and allow browser site storage to use this field test.</div>`}}
function toast(m,bad=false){let n=$('#status');if(n){n.textContent=m;n.style.color=bad?'var(--danger)':'var(--accent)'}}
function rows(list){return list.sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created).map(r=>{let url=URL.createObjectURL(r.blob);return `<button class="receipt receiptCard" data-action="detail" data-id="${r.id}"><img class="receiptThumb" src="${url}" alt="Receipt for ${esc(r.job)}"><div class="receiptInfo"><div class="job">${esc(r.job)}</div><div class="receiptMeta">${fmt(r.date)}${r.merchant?` · ${esc(r.merchant)}`:''}</div></div><div class="chev">›</div></button>`}).join('')}
function layout(content,home=false){app.innerHTML=content+`<div id="status" class="demoLabel" aria-live="polite"></div>`;document.getElementById('fieldBar')?.remove();document.getElementById('fieldNav')?.remove();let b=document.createElement('div');b.id='fieldBar';b.className='actionBar';b.hidden=!home;b.innerHTML='<button class="sendFixed" data-action="review-week">Send week now</button><button class="captureFab" data-action="capture"><span class="camera">▣</span>Capture receipt</button>';document.body.append(b);let n=document.createElement('nav');n.id='fieldNav';n.className='nav';n.innerHTML='<button data-action="home">Current Week</button><button data-action="archive">Archive</button><button data-action="history">History</button><button data-action="settings">Settings</button>';document.body.append(n)}
function show(view){let w=week();if(view==='home'){let list=receipts.filter(r=>r.date>=w.start&&r.date<=w.end);layout(`<header class="top"><div><p class="eyebrow">Current Week · On-device field test</p><h1 class="brand">STUBS!</h1><p class="week">${fmt(w.start)} — ${fmt(w.end)}</p></div><div class="pill">${list.length} receipt${list.length===1?'':'s'}</div></header><div class="notice">Stored on this device only. Export promptly: this field test is not cloud backup.</div><h2 class="sectionTitle">Receipts</h2><div class="card">${rows(list)||'<div class="empty"><b>No receipts this week.</b><br>Use Capture receipt to add one.</div>'}</div>`,true);return}if(view==='capture'){layout(`<button class="back" data-action="home">← Current Week</button><h1 class="brand">Capture Receipt</h1><p class="muted">Choose how to add a receipt photo.</p><div class="card formCard"><label class="captureChoice"><span class="camera">▣</span>Take photo<input data-file="camera" type="file" accept="image/*" capture="environment"></label><label class="captureChoice secondaryChoice">Choose from photos<input data-file="library" type="file" accept="image/*"></label><p class="demoLabel">Your device or browser decides whether a camera is offered. Photos are stored only on this device.</p><button class="linkBtn" data-action="home">Cancel</button></div>`);return}if(view==='archive'){let groups={};receipts.filter(r=>r.date<w.start).forEach(r=>{let k=week(r.date).start;(groups[k]??=[]).push(r)});layout(`<h1 class="brand">Archive</h1><p class="muted">Older weeks remain on this device after export.</p><div class="card">${Object.keys(groups).sort().reverse().map(k=>`<div class="weekItem"><div><b>${fmt(k)} — ${fmt(week(k).end)}</b><span class="small">${groups[k].length} receipts</span></div><button class="linkBtn" data-action="archive-week" data-week="${k}">View</button></div>`).join('')||'<div class="empty">No archived receipts.</div>'}</div>`);return}if(view==='history'){layout(`<h1 class="brand">Delivery history</h1><p class="muted">Local export and sharing activity only.</p><div class="card">${deliveries.sort((a,b)=>b.at.localeCompare(a.at)).map(d=>`<div class="historyItem"><div class="historyType">${esc(d.type)}</div><div class="historyText">${new Date(d.at).toLocaleString()}<br><b>${esc(d.name)}</b><br>${d.ids.length} receipt${d.ids.length===1?'':'s'} · ${esc(d.outcome)}</div></div>`).join('')||'<div class="empty">No exports recorded yet.</div>'}</div>`);return}if(view==='settings'){layout(`<h1 class="brand">Settings</h1><div class="card formCard"><label>Recipient email <span class="muted">(unused planning preference)</span></label><input id="email" type="email" value="${esc(settings.email)}"><label>Preferred export weekday</label><select id="weekday">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(d=>`<option ${d===settings.weekday?'selected':''}>${d}</option>`).join('')}</select><label>Preferred time</label><input id="time" type="time" value="${settings.time}"><button class="btn primary full" data-action="save-settings">Save local preferences</button></div><div class="notice"><b>How this field test works</b><br>Capture and store receipts on this device. Export a ZIP, then choose a sharing method yourself. Automatic email and scheduling are not implemented.<br><br>Data survives ordinary refreshes and browser restarts on this device, but is not cloud backup and can be lost if browser/site data is cleared or the device is lost.</div>`);return}}
function preview(){layout(`<button class="back" data-action="capture">← Choose another</button><h1 class="brand">Photo ready</h1><div class="card formCard"><img class="detailImg" style="height:210px" src="${selected.url}" alt="Selected receipt"><p class="demoLabel">${esc(selected.file.name||'Selected image')} · stored locally after saving</p><button class="btn primary full" data-action="details">Continue</button></div>`)}
function details(){layout(`<button class="back" data-action="capture">← Capture Receipt</button><h1 class="brand">Receipt details</h1><form id="receiptForm" class="card formCard"><img class="detailImg" style="height:130px" src="${selected.url}" alt="Selected receipt"><label>Date</label><input id="date" type="date" value="${today()}" required><label>Job last name *</label><input id="job" required autocomplete="off"><label>Merchant <span class="muted">(optional)</span></label><input id="merchant" autocomplete="off"><div id="formError" class="error"></div><button class="btn primary full">Save Receipt</button><button type="button" class="linkBtn" data-action="home">Cancel</button></form>`);$('#receiptForm').onsubmit=saveReceipt}
async function normalizeJPEG(file){let url=URL.createObjectURL(file),img;try{if(window.createImageBitmap)img=await createImageBitmap(file);else img=await new Promise((ok,bad)=>{let x=new Image;x.onload=()=>ok(x);x.onerror=bad;x.src=url});let scale=Math.min(1,3000/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));let g=c.getContext('2d');g.globalCompositeOperation='source-over';g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);let blob=await new Promise((ok,bad)=>c.toBlob(b=>b?ok(b):bad(Error('JPEG encoding failed')),'image/jpeg',.92));if(!blob.size)throw Error('JPEG encoding returned no data');return blob}finally{if(img&&img.close)img.close();URL.revokeObjectURL(url)}}
async function saveReceipt(e){e.preventDefault();let job=$('#job').value.trim();if(!job)return $('#formError').textContent='Please enter the job last name.';if(!selected)return $('#formError').textContent='Photo missing. Choose a receipt photo and try again.';$('#formError').textContent='Normalizing photo to JPEG…';try{let jpeg=await normalizeJPEG(selected.file),r={id:crypto.randomUUID(),blob:jpeg,mime:'image/jpeg',size:jpeg.size,date:$('#date').value,job,merchant:$('#merchant').value.trim(),original:selected.file.name||'',created:Date.now()};if(!exportable(r))throw Error('Normalized receipt is not exportable');await put('receipts',r);receipts.push(r);URL.revokeObjectURL(selected.url);selected=null;show('home')}catch(x){$('#formError').textContent=`Could not convert and save this photo: ${x.message}. Choose another image and retry.`}}
function detail(id){let r=receipts.find(x=>x.id===id);if(!r)return show('home');let url=URL.createObjectURL(r.blob);layout(`<button class="back" data-action="home">← Back to Week</button><h1 class="brand">Receipt</h1><button class="full" style="padding:0;background:transparent" data-action="zoom-image" data-id="${r.id}" aria-label="Open full receipt image"><img class="detailImg" src="${url}" alt="Receipt for ${esc(r.job)}"></button><p class="demoLabel">Tap the receipt image to inspect it full screen.</p><div class="card detailCard"><h2>${esc(r.job)}</h2><div class="meta"><b>Date</b><span>${fmt(r.date)}</span><b>Merchant</b><span>${esc(r.merchant)||'<span class="muted">Not entered</span>'}</span><b>Export filename</b><span class="filename">${fileName(r)}</span></div><button class="btn secondary full" data-action="share-one" data-id="${r.id}">Export this receipt</button></div>`)}
function zoomImage(id){let r=receipts.find(x=>x.id===id);if(!r)return show('home');let url=URL.createObjectURL(r.blob);layout(`<button class="back" data-action="detail" data-id="${r.id}">← Back to receipt</button><h1 class="brand">Receipt image</h1><img class="zoomImage" src="${url}" alt="Full receipt for ${esc(r.job)}"><p class="demoLabel">Pinch or browser-zoom to inspect fine print.</p>`)}
function review(w=week().start){let range=week(w),prior=new Set(deliveries.filter(d=>d.week===range.start&&d.type.includes('weekly')).flatMap(d=>d.ids)),list=eligibleFor(range,prior),add=prior.size>0;layout(`<button class="back" data-action="home">← Current Week</button><h1 class="brand">Review export</h1><p class="week">${fmt(range.start)} — ${fmt(range.end)}</p><div class="card detailCard"><div class="summary"><strong>${list.length} eligible receipt${list.length===1?'':'s'}</strong><br>${esc(packName(range,add))}<br><span class="small">${list.map(fileName).join('<br>')||'Every receipt in this week was already exported.'}</span></div><p class="demoLabel">This creates a real ZIP on your device. Sharing does not send email from STUBS.</p><button class="btn primary full" ${list.length?'':'disabled'} data-action="build-zip" data-week="${range.start}">Create ZIP</button><button class="linkBtn" data-action="home">Cancel</button></div>`)}
const CRC=(()=>{let t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xEDB88320:0);t[n]=c>>>0}return t})();
function crc(a){let c=0xffffffff;for(let i=0;i<a.length;i++)c=CRC[(c^a[i])&255]^(c>>>8);return(c^0xffffffff)>>>0}function bytes(s){let a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&127;return a}function w16(a,o,n){a[o]=n&255;a[o+1]=(n>>>8)&255}function w32(a,o,n){a[o]=n&255;a[o+1]=(n>>>8)&255;a[o+2]=(n>>>16)&255;a[o+3]=(n>>>24)&255}function r16(a,o){return a[o]|a[o+1]<<8}function r32(a,o){return(a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
function uniqueNames(list){let used=new Map;return list.map(r=>{let n=fileName(r),c=used.get(n)||0;used.set(n,c+1);return c?`${n.slice(0,n.lastIndexOf('.'))}_${c+1}.jpg`:n})}
async function zip(list){if(!list.length)throw Error('No eligible JPEG receipts to export');if(list.some(r=>!exportable(r)))throw Error('An ineligible receipt was blocked from export');let chunks=[],entries=[],offset=0,names=uniqueNames(list);for(let i=0;i<list.length;i++){let data=new Uint8Array(await list[i].blob.arrayBuffer()),name=bytes(names[i]),sum=crc(data),head=new Uint8Array(30+name.length);w32(head,0,0x04034b50);w16(head,4,20);w16(head,8,0);w32(head,14,sum);w32(head,18,data.length);w32(head,22,data.length);w16(head,26,name.length);head.set(name,30);chunks.push(head,data);entries.push({name:names[i],nameBytes:name,crc:sum,size:data.length,offset});offset+=head.length+data.length}let centralOffset=offset,centralSize=0;for(let e of entries){let h=new Uint8Array(46+e.nameBytes.length);w32(h,0,0x02014b50);w16(h,4,20);w16(h,6,20);w16(h,10,0);w32(h,16,e.crc);w32(h,20,e.size);w32(h,24,e.size);w16(h,28,e.nameBytes.length);w32(h,42,e.offset);h.set(e.nameBytes,46);chunks.push(h);centralSize+=h.length;offset+=h.length}let end=new Uint8Array(22);w32(end,0,0x06054b50);w16(end,8,entries.length);w16(end,10,entries.length);w32(end,12,centralSize);w32(end,16,centralOffset);chunks.push(end);let blob=new Blob(chunks,{type:'application/zip'});return{blob,entries}}
async function verifyZip(blob,expected){let a=new Uint8Array(await blob.arrayBuffer()),p=-1;for(let i=a.length-22;i>=Math.max(0,a.length-65557);i--)if(r32(a,i)===0x06054b50){p=i;break}if(p<0||r16(a,p+8)!==expected.length)throw Error('ZIP end record is invalid');let at=r32(a,p+16);for(let i=0;i<expected.length;i++){if(r32(a,at)!==0x02014b50)throw Error('ZIP central directory is invalid');let nl=r16(a,at+28),method=r16(a,at+10),size=r32(a,at+24),sum=r32(a,at+16),lo=r32(a,at+42),name='';for(let j=0;j<nl;j++)name+=String.fromCharCode(a[at+46+j]);let e=expected[i];if(name!==e.name||method!==0||size!==e.size||sum!==e.crc||r32(a,lo)!==0x04034b50||r32(a,lo+14)!==sum)throw Error(`ZIP entry verification failed: ${name}`);at+=46+nl+r16(a,at+30)+r16(a,at+32)}return true}
async function buildZip(start){let w=week(start),prior=new Set(deliveries.filter(d=>d.week===w.start&&d.type.includes('weekly')).flatMap(d=>d.ids)),list=eligibleFor(w,prior),add=prior.size>0;try{toast('Building and verifying ZIP…');let made=await zip(list);await verifyZip(made.blob,made.entries);zipState={blob:made.blob,list,w,add,name:packName(w,add),entries:made.entries};showExport()}catch(e){toast(`ZIP verification failed: ${e.message}. Nothing was recorded.`,true)}}
function showExport(){let z=zipState,url=URL.createObjectURL(z.blob);layout(`<button class="back" data-action="home">← Current Week</button><h1 class="brand">ZIP verified</h1><div class="card detailCard"><div class="summary"><strong>${esc(z.name)}</strong><br>${z.list.length} JPEG file${z.list.length===1?'':'s'} · ${(z.blob.size/1024).toFixed(1)} KB<br><span class="small">Internal ZIP structure and CRC verification passed.</span></div><button class="btn primary full" data-action="share-zip">Open sharing</button><a class="btn secondary full" style="display:block;margin-top:10px" href="${url}" download="${z.name}" data-action="download-zip">Download ZIP</a><p class="demoLabel">Choose your own sharing method. STUBS cannot verify an email was sent.</p></div>`)}
async function recordExport(outcome){let z=zipState,d={id:crypto.randomUUID(),at:new Date().toISOString(),week:z.w.start,name:z.name,type:'manual weekly export',ids:z.list.map(r=>r.id),entries:z.entries.map(e=>({name:e.name,size:e.size,crc:e.crc})),outcome};try{await put('deliveries',d);deliveries.push(d);zipState=null;show('history')}catch(e){toast('ZIP is ready, but the export record could not be saved. Try again.',true)}}
async function shareZip(){if(!zipState)return toast('Create and verify a ZIP before sharing.',true);let z=zipState,f=new File([z.blob],z.name,{type:'application/zip'});if(!navigator.share)return toast('This browser does not support native sharing. Download ZIP is available below.',true);if(!navigator.canShare)return toast('This browser cannot confirm file sharing support. Download ZIP is available below.',true);if(!navigator.canShare({files:[f]}))return toast('This device cannot share ZIP files here. Download ZIP is available below.',true);try{await navigator.share({files:[f],title:`STUBS! ${z.name}`,text:`${z.list.length} receipt file${z.list.length===1?'':'s'} ready to share.`});await recordExport('share sheet opened')}catch(e){let cancelled=e&&e.name==='AbortError';toast(cancelled?'Sharing was cancelled. Download ZIP remains available.':`Could not open sharing: ${e.message||'browser error'}. Download ZIP remains available.`,!cancelled)}}
async function shareOne(id){let r=receipts.find(x=>x.id===id),f=new File([r.blob],fileName(r),{type:r.mime});if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){try{await navigator.share({files:[f],title:fileName(r)});let d={id:crypto.randomUUID(),at:new Date().toISOString(),name:fileName(r),type:'individual export',ids:[id],outcome:'opened for sharing'};await put('deliveries',d);deliveries.push(d);show('history')}catch(e){toast('Sharing was cancelled or unavailable.',true)}}else{let a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=fileName(r);a.click();toast('Download started. Individual downloads are not weekly exports.')}}
document.addEventListener('change',e=>{if(!e.target.matches('[data-file]'))return;let f=e.target.files?.[0];if(!f)return toast('No photo selected. Choose a photo to continue.',true);if(!f.type.startsWith('image/'))return toast('Please choose an image file.',true);selected={file:f,url:URL.createObjectURL(f)};preview()});
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='home')show('home');else if(a==='capture')show('capture');else if(a==='details')details();else if(a==='detail')detail(b.dataset.id);else if(a==='zoom-image')zoomImage(b.dataset.id);else if(a==='archive')show('archive');else if(a==='history')show('history');else if(a==='settings')show('settings');else if(a==='archive-week')review(b.dataset.week);else if(a==='review-week')review();else if(a==='build-zip')await buildZip(b.dataset.week);else if(a==='share-zip')await shareZip();else if(a==='download-zip')setTimeout(()=>recordExport('download started'),0);else if(a==='share-one')await shareOne(b.dataset.id);else if(a==='save-settings'){try{settings={id:'local',email:$('#email').value.trim(),weekday:$('#weekday').value,time:$('#time').value};await put('settings',settings);toast('Local preferences saved.')}catch(x){toast('Could not save preferences. Please retry.',true)}}});
load();
})();
</script>
</body></html>
